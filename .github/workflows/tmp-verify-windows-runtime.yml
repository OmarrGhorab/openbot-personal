name: TEMP verify Windows runtime install (fork release step)
on:
  push:
    branches: [fix/windows-fork-release]
permissions:
  contents: read
jobs:
  old-bash:
    runs-on: windows-latest
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-bun
        with: { install: none }
      - run: bun install --frozen-lockfile
      - name: Old step (shell bash), expected to fail
        id: old
        continue-on-error: true
        shell: bash
        run: |
          which tar; tar --version | head -1
          bun scripts/install-remote-desktop-runtime.ts win32 x64
      - run: if ("${{ steps.old.outcome }}" -ne "failure") { throw "old step did not fail" }
  new-default:
    runs-on: windows-latest
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-bun
        with: { install: none }
      - run: bun install --frozen-lockfile
      - name: Fixed step (default shell, same commands as fork-release.yml)
        run: |
          (Get-Command tar).Source; tar --version
          bun scripts/install-remote-desktop-runtime.ts win32 x64
          bun run verify:remote-desktop-runtime --windows
