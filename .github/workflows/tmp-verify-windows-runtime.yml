name: TEMP verify Windows runtime install (fork release step)
on:
  push:
    branches: [fix/windows-fork-release]
permissions:
  contents: read
jobs:
  old-bash:
    runs-on: windows-latest
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-bun
        with: { install: none }
      - run: bun install --frozen-lockfile
      - name: Old step (shell bash), expected to fail
        id: old
        continue-on-error: true
        shell: bash
        run: |
          which tar; tar --version | head -1
          bun scripts/install-remote-desktop-runtime.ts win32 x64
      - run: if ("${{ steps.old.outcome }}" -ne "failure") { throw "old step did not fail" }
  new-default:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: "${{ github.token }}"
      VERSION: "0.53.0"
      OPENBOT_ACCOUNT_URL: ${{ vars.OPENBOT_ACCOUNT_URL }}
      OPENBOT_SIGNAL_URL: ${{ vars.OPENBOT_SIGNAL_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-bun
        with: { install: none }
      - run: bun install --frozen-lockfile
      - name: Install native runtimes
        run: |
          bun run install:codex-runtime
          bun run install:claude-runtime
          bun run install:grok-runtime
      - name: Fixed step (default shell, same commands as fork-release.yml)
        run: |
          (Get-Command tar).Source; tar --version
          bun scripts/install-remote-desktop-runtime.ts win32 x64
          bun run verify:remote-desktop-runtime --windows
      - name: Build x64 installer (publish never; nothing is uploaded)
        run: bun run dist:win
      - name: Verify Windows release files
        shell: bash
        run: |
          ls -la dist
          test -f "dist/OpenBot-$VERSION-x64.exe" && test -f dist/latest.yml
          cat dist/latest.yml
          grep -F "OpenBot-$VERSION-x64.exe" dist/latest.yml
